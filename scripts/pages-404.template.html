<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Redirecting…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: #fffaf3;
        color: #241a12;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to the church website…</p>
    <script>
      (function () {
        var redirectBase = '%BASE_URL%';
        var redirectPath = window.location.pathname + window.location.search + window.location.hash;

        if (redirectBase !== '/' && redirectPath.indexOf(redirectBase) !== 0) {
          redirectPath = redirectBase.replace(/\/$/, '') + redirectPath;
        }

        try {
          window.sessionStorage.setItem('fccanniston.redirect-path', redirectPath);
        } catch (error) {
          // Ignore session storage failures and continue redirecting.
        }

        window.location.replace(redirectBase);
      })();
    </script>
  </body>
</html>
