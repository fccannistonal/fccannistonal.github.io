<!DOCTYPE html>
<html lang="en" data-mantine-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#fffaf3" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width"
    />
    <link
      rel="preload"
      as="image"
      href="/images/home/sanctuary-hero-1600.avif"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/images/home/sanctuary-hero-480.avif 480w, /images/home/sanctuary-hero-768.avif 768w, /images/home/sanctuary-hero-1200.avif 1200w, /images/home/sanctuary-hero-1600.avif 1600w"
      imagesizes="100vw"
    />
    <title>First Christian Church Anniston</title>
    <script>
      (function () {
        var preferenceKey = 'fccanniston.locale';
        var preferredLocale = null;

        try {
          var storedLocale = window.localStorage.getItem(preferenceKey);
          if (storedLocale === 'en' || storedLocale === 'es') {
            preferredLocale = storedLocale;
          }
        } catch (error) {
          preferredLocale = null;
        }

        if (!preferredLocale) {
          var languages =
            Array.isArray(navigator.languages) && navigator.languages.length > 0
              ? navigator.languages
              : [navigator.language];

          for (var index = 0; index < languages.length; index += 1) {
            var locale = String(languages[index] || '')
              .toLowerCase()
              .split(/[-_]/)[0];

            if (locale === 'en' || locale === 'es') {
              preferredLocale = locale;
              break;
            }
          }
        }

        if (
          preferredLocale === 'es' &&
          (window.location.pathname.replace(/\/+$/, '') || '/') === '/'
        ) {
          window.location.replace('/es' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
