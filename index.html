<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width, user-scalable=no"
    />
    <title>First Christian Church Anniston</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- BRANCH_PAGES_FALLBACK_START -->
    <script>
      (function () {
        var hostname = window.location.hostname;
        var isLocalHost =
          hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]';

        if (isLocalHost || window.location.pathname.indexOf('/docs/') === 0) {
          return;
        }

        window.location.replace('/docs/' + window.location.search + window.location.hash);
      })();
    </script>
    <!-- BRANCH_PAGES_FALLBACK_END -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
